<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06090f">
<title>Sudoku</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, #0f1526 0%, #06090f 60%, #03060c 100%);
    color: #d5dfee;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #stars {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  #stage {
    position: relative;
    transform-origin: center center;
    z-index: 1;
    will-change: transform;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: flex; align-items: center; justify-content: center; flex-direction: column; }
  #confetti {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10; display: none;
  }
  #confetti.active { display: block; }
  #fade {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, #0a0f1c 0%, #06090f 100%);
    opacity: 0; transition: opacity 150ms ease;
    pointer-events: none; z-index: 100;
  }

  .menu-title {
    font-size: 82px; font-weight: 900;
    background: linear-gradient(180deg, #e8eeff 0%, #a8b8d8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    text-shadow: 0 0 30px rgba(95,175,255,.35);
    letter-spacing: 0.06em; margin-bottom: 10px;
    filter: drop-shadow(0 0 24px rgba(95,175,255,.5));
  }
  .menu-underline {
    width: 200px; height: 3px;
    background: linear-gradient(90deg, transparent, #5fafff, transparent);
    border-radius: 2px;
  }
  .menu-sub {
    font-size: 20px; color: #8296c3; letter-spacing: 0.28em;
    margin: 28px 0 44px;
  }
  .menu-cards { display: flex; flex-direction: column; gap: 18px; }
  .card {
    width: 380px; height: 92px; border-radius: 20px;
    background: linear-gradient(180deg, #202a48 0%, #161e34 100%);
    border: 1px solid #3a4e78;
    color: #d5dfee; font-size: 28px; font-weight: 800;
    letter-spacing: 0.08em; cursor: pointer;
    display: flex; align-items: center; padding-left: 32px;
    position: relative; text-align: left;
    transition: transform 160ms cubic-bezier(.34,1.56,.64,1), background 160ms, border-color 160ms, box-shadow 160ms;
    touch-action: manipulation; font-family: inherit;
    box-shadow: 0 4px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .card::before {
    content: ''; position: absolute; left: 0; top: 20px; bottom: 20px;
    width: 5px; border-radius: 0 3px 3px 0;
    background: #5fafff; box-shadow: 0 0 12px rgba(95,175,255,.7);
  }
  .card.continue::before { background: #78e6b4; box-shadow: 0 0 12px rgba(120,230,180,.7); }
  .card.create::before { background: #ffcd5a; box-shadow: 0 0 12px rgba(255,205,90,.7); }
  .card .sub {
    position: absolute; left: 32px; top: 58px;
    font-size: 13px; font-weight: 500; color: #8296c3; letter-spacing: 0.04em;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(95,175,255,.25), inset 0 1px 0 rgba(255,255,255,.08); }
  .card:active { transform: translateY(0); background: #283660; border-color: #78beff; color: #fff; }

  .diff-title {
    font-size: 60px; font-weight: 900;
    background: linear-gradient(180deg, #e8eeff 0%, #a8b8d8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    letter-spacing: 0.06em; margin-bottom: 8px;
    filter: drop-shadow(0 0 24px rgba(95,175,255,.4));
  }
  .diff-underline {
    width: 200px; height: 3px;
    background: linear-gradient(90deg, transparent, #5fafff, transparent);
    border-radius: 2px;
  }
  .diff-sub {
    font-size: 18px; color: #8296c3; letter-spacing: 0.28em;
    margin: 20px 0 32px;
  }
  .stars-row { display: flex; gap: 18px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
  .star-slot {
    width: 60px; cursor: pointer; display: flex;
    flex-direction: column; align-items: center; gap: 6px;
    touch-action: manipulation;
    transition: transform 160ms cubic-bezier(.34,1.56,.64,1);
  }
  .star-slot .star {
    font-size: 44px; line-height: 1; color: #232b48;
    transition: all 180ms ease;
    text-shadow: 0 0 0 rgba(255,205,90,0);
  }
  .star-slot.on .star {
    color: #ffcd5a;
    text-shadow: 0 0 16px rgba(255,205,90,.65), 0 0 4px rgba(255,205,90,.9);
  }
  .star-slot.on { transform: scale(1.06); }
  .star-slot .num {
    font-size: 13px; font-weight: 700; color: #4a5578;
    transition: color 180ms ease;
  }
  .star-slot.on .num { color: #ffe0a0; }
  .diff-label {
    font-size: 26px; font-weight: 800; letter-spacing: 0.08em;
    color: #5fafff; margin-bottom: 8px; min-height: 32px;
    transition: color 200ms;
  }
  .diff-best { font-size: 14px; color: #8296c3; margin-bottom: 30px; min-height: 18px; }
  .diff-hint { font-size: 15px; color: #8296c3; margin-top: 30px; }

  .btn {
    border-radius: 12px; border: 1px solid #3e4c74;
    background: linear-gradient(180deg, #293458 0%, #1c2440 100%);
    color: #d5dfee; font-size: 14px; font-weight: 700;
    cursor: pointer; padding: 0 16px; height: 40px;
    letter-spacing: 0.05em;
    transition: transform 120ms, background 120ms, border-color 120ms, box-shadow 120ms;
    font-family: inherit; touch-action: manipulation;
    box-shadow: 0 2px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .btn:hover { background: linear-gradient(180deg, #364a78 0%, #26325a 100%); border-color: #8cbcff; color: #fff; box-shadow: 0 4px 16px rgba(95,175,255,.3); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; transform: none; }
  .btn.primary {
    background: linear-gradient(180deg, #4a7ec8 0%, #2e5090 100%);
    border-color: #6fbcff; color: #fff;
    height: 56px; font-size: 20px;
    box-shadow: 0 4px 20px rgba(95,175,255,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .btn.primary:hover { background: linear-gradient(180deg, #6fafff 0%, #4a80d0 100%); color: #0c1224; }
  .btn.danger {
    background: linear-gradient(180deg, #452430 0%, #2e1820 100%);
    border-color: #7a3e52; color: #ff9bb0;
    height: 58px; font-size: 20px;
    box-shadow: 0 4px 16px rgba(255,80,120,.15), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .btn.danger:hover { background: linear-gradient(180deg, #7a2e40 0%, #52202c 100%); border-color: #ff7290; color: #fff; }
  .btn.save { background: linear-gradient(180deg, #2c5240 0%, #1c3628 100%); border-color: #448066; color: #96ebbe; }
  .btn.save:hover { background: linear-gradient(180deg, #3e7a5a 0%, #2a5040 100%); border-color: #78e6b4; color: #fff; }
  .btn.load { background: linear-gradient(180deg, #2e3a60 0%, #202a44 100%); border-color: #4a5a80; color: #bed2f5; }
  .btn.load:hover { background: linear-gradient(180deg, #445484 0%, #2e3a60 100%); border-color: #96beff; color: #fff; }
  .btn.export { background: linear-gradient(180deg, #3e3258 0%, #2a2244 100%); border-color: #624a88; color: #d7beff; }
  .btn.export:hover { background: linear-gradient(180deg, #5e4a88 0%, #3e3264 100%); border-color: #c8a0ff; color: #fff; }
  .btn.hint { background: linear-gradient(180deg, #55452c 0%, #352a1a 100%); border-color: #86682a; color: #f0d282; }
  .btn.hint:hover:not(:disabled) { background: linear-gradient(180deg, #86683a 0%, #55442a 100%); border-color: #ffd26e; color: #fff; }

  .layout {
    display: flex; align-items: center; justify-content: center;
    gap: 30px; width: 100%; height: 100%; padding: 20px;
  }
  .grid-wrap { position: relative; flex-shrink: 0; }
  .grid-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { display: flex; flex-direction: column; gap: 14px; }
  .info-row {
    display: flex; justify-content: space-between;
    font-size: 16px; font-weight: 700; color: #d5dfee;
    letter-spacing: 0.04em;
  }
  .info-row .hints { color: #b9dcff; }
  .pad {
    display: grid; grid-template-columns: repeat(3, 72px);
    gap: 14px; justify-content: center;
  }
  .pad button {
    width: 72px; height: 72px; border-radius: 16px;
    border: 1px solid #3e5278;
    background: linear-gradient(180deg, #26324e 0%, #1a2138 100%);
    color: #d5dfee; font-size: 34px; font-weight: 800;
    cursor: pointer; font-family: inherit; touch-action: manipulation;
    transition: transform 100ms, background 120ms, border-color 120ms, box-shadow 120ms;
    box-shadow: 0 3px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .pad button:hover { background: linear-gradient(180deg, #384a74 0%, #28324e 100%); border-color: #78beff; color: #fff; box-shadow: 0 4px 16px rgba(95,175,255,.3); }
  .pad button:active { transform: scale(0.94); }
  .pad button.dimmed { opacity: 0.25; pointer-events: none; filter: grayscale(1); }
  .actions-row { display: flex; gap: 10px; }
  .actions-row .btn { flex: 1; }

  .editor-status {
    font-size: 16px; font-weight: 800; text-align: center;
    letter-spacing: 0.05em; min-height: 22px;
    color: #8fa2c4; transition: color 200ms;
  }
  .editor-status.ok { color: #78e6b4; text-shadow: 0 0 12px rgba(120,230,180,.5); }
  .editor-status.warn { color: #ffcd5a; text-shadow: 0 0 12px rgba(255,205,90,.5); }
  .editor-status.err { color: #ff7290; text-shadow: 0 0 12px rgba(255,114,144,.5); }

  .tip {
    font-size: 13px; color: #5f6e90; text-align: center;
    letter-spacing: 0.02em;
  }
  .play-stars {
    display: flex; gap: 4px; justify-content: center; padding: 4px 0;
    font-size: 13px; color: #232b48;
  }
  .play-stars .star.on { color: #ffcd5a; text-shadow: 0 0 8px rgba(255,205,90,.6); }
  .custom-badge {
    text-align: center; font-size: 14px; font-weight: 800;
    color: #ffcd5a; letter-spacing: 0.15em;
    text-shadow: 0 0 12px rgba(255,205,90,.4);
  }

  .popup {
    position: absolute;
    background: linear-gradient(180deg, #1a2340 0%, #121a2e 100%);
    border: 2px solid #6990c8;
    border-radius: 16px;
    z-index: 50;
    display: none;
    padding: 6px;
    box-shadow: 0 10px 44px rgba(0,0,0,.75), 0 0 44px rgba(95,175,255,.35), inset 0 1px 0 rgba(255,255,255,.06);
    touch-action: manipulation;
  }
  .popup.active {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    animation: popupIn 140ms cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popupIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .popup button {
    border-radius: 9px;
    border: 1px solid #2c3654;
    background: linear-gradient(180deg, #202a46 0%, #161c30 100%);
    color: #8fa2c4;
    font-size: 22px; font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 120ms, color 120ms, border-color 120ms, box-shadow 120ms, transform 100ms;
    font-family: inherit;
    touch-action: manipulation;
    padding: 0; line-height: 1;
    min-width: 0; min-height: 0;
  }
  .popup button:hover { background: linear-gradient(180deg, #33405e 0%, #222c44 100%); color: #b9dcff; border-color: #5a6e9c; }
  .popup button:active { transform: scale(0.9); }
  .popup button.sel {
    background: linear-gradient(180deg, #3e5490 0%, #2a3a68 100%);
    color: #96f5aa;
    border: 2px solid #5fafff;
    box-shadow: 0 0 14px rgba(95,175,255,.6), inset 0 1px 0 rgba(255,255,255,.1);
  }

  .won-panel {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 28px;
  }
  .won-title {
    font-size: 56px; font-weight: 900;
    background: linear-gradient(180deg, #ffe0a0 0%, #ffcd5a 50%, #c8943a 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    letter-spacing: 0.04em; line-height: 1;
    filter: drop-shadow(0 0 24px rgba(255,205,90,.6));
    animation: wonPulse 1.8s ease-in-out infinite;
  }
  @keyframes wonPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .won-stats {
    font-size: 16px; font-weight: 700;
    color: #d5dfee; letter-spacing: 0.08em;
    line-height: 1.9;
  }
  .won-hint {
    font-size: 13px; color: #8296c3; margin-top: 16px;
  }

  body.portrait .layout { flex-direction: column; gap: 20px; }
  body.portrait .grid-wrap { width: 576px; height: 576px; }
  body.portrait .panel { width: 576px; }
  body.portrait .pad { grid-template-columns: repeat(3, 88px); gap: 14px; }
  body.portrait .pad button { width: 88px; height: 88px; font-size: 40px; border-radius: 18px; }
  body.portrait .tip { display: none; }
  body.portrait .play-stars { padding: 2px 0; }
  body.portrait .info-row { font-size: 18px; }
  body.portrait .menu-title { font-size: 60px; }
  body.portrait .diff-title { font-size: 44px; }
  body.portrait .stars-row { max-width: 520px; gap: 6px; }
  body.portrait .star-slot { width: 42px; }
  body.portrait .star-slot .star { font-size: 30px; }
  body.portrait .card { width: 340px; height: 82px; font-size: 24px; }
  body.portrait .card .sub { font-size: 12px; top: 52px; }
  body.portrait .won-title { font-size: 44px; }
  body.portrait .won-stats { font-size: 15px; }
  body.portrait .won-panel { gap: 20px; }

  body.landscape .grid-wrap { width: 576px; height: 576px; }
  body.landscape .panel { width: 280px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="stage">
  <div class="screen" data-screen="menu">
    <div class="menu-title">SUDOKU</div>
    <div class="menu-underline"></div>
    <div class="menu-sub">CHOOSE A MODE</div>
    <div class="menu-cards">
      <button class="card continue" data-action="continue">
        CONTINUE<span class="sub">Resume your saved game</span>
      </button>
      <button class="card generate" data-action="generate">
        GENERATE<span class="sub">Random puzzle with difficulty</span>
      </button>
      <button class="card create" data-action="create">
        CREATE<span class="sub">Build your own puzzle</span>
      </button>
    </div>
  </div>

  <div class="screen" data-screen="difficulty">
    <div class="diff-title">SUDOKU</div>
    <div class="diff-underline"></div>
    <div class="diff-sub">SELECT DIFFICULTY</div>
    <div class="stars-row" id="diff-stars"></div>
    <div class="diff-label" id="diff-label"></div>
    <div class="diff-best" id="diff-best"></div>
    <button class="btn" id="diff-back" style="width:120px;height:44px;font-size:16px;">BACK</button>
    <div class="diff-hint">Tap a star to begin</div>
  </div>

  <div class="screen" data-screen="editor">
    <div class="layout">
      <div class="grid-wrap"><canvas class="grid-canvas" id="editor-canvas"></canvas></div>
      <div class="panel">
        <div class="editor-status" id="editor-status">Empty grid</div>
        <div class="pad" id="editor-pad"></div>
        <button class="btn danger" id="editor-clear">CLEAR</button>
        <div class="actions-row">
          <button class="btn save" id="editor-save">SAVE</button>
          <button class="btn load" id="editor-load">LOAD</button>
        </div>
        <div class="actions-row">
          <button class="btn export" id="editor-png">PNG</button>
          <button class="btn export" id="editor-jpg">JPG</button>
        </div>
        <button class="btn primary" id="editor-play">PLAY</button>
        <button class="btn" id="editor-back">BACK</button>
      </div>
    </div>
  </div>

  <div class="screen" data-screen="play">
    <div class="layout">
      <div class="grid-wrap">
        <canvas class="grid-canvas" id="play-canvas"></canvas>
        <div class="popup" id="popup"></div>
      </div>
      <div class="panel">
        <div class="play-stars" id="play-stars"></div>
        <div class="info-row">
          <span id="play-time">TIME 00:00</span>
          <span class="hints" id="play-hints">HINTS 3</span>
        </div>
        <div class="pad" id="play-pad"></div>
        <div class="actions-row">
          <button class="btn" id="play-undo">UNDO</button>
          <button class="btn" id="play-redo">REDO</button>
          <button class="btn hint" id="play-hint">HINT 3</button>
        </div>
        <button class="btn danger" id="play-clear">CLEAR</button>
        <div class="tip">A autosolve · H hint · R restart · N new · Ctrl+Z/Y undo · Ctrl+S solve · double-click for notes</div>
      </div>
    </div>
  </div>

  <div class="screen" data-screen="won">
    <div class="layout">
      <div class="grid-wrap"><canvas class="grid-canvas" id="won-canvas"></canvas></div>
      <div class="panel won-panel">
        <div class="won-title">SOLVED!</div>
        <div class="won-stats" id="won-stats"></div>
        <div class="won-hint">Click anywhere to return</div>
      </div>
    </div>
  </div>

  <canvas id="confetti"></canvas>
  <div id="fade"></div>
</div>

<script>
'use strict';

const CELL = 64;
const GRID_SIZE = CELL * 9;
const GRID_X = 0, GRID_Y = 0;
const LANDSCAPE_W = 966, LANDSCAPE_H = 656;
const PORTRAIT_W = 616, PORTRAIT_H = 1030;
const POPUP_SIZE_LOCAL = 180;
const MAX_LEVEL = 11;
const MAX_HINTS = 3;
const SAVE_DEBOUNCE_MS = 500;
const SOLVE_STEP_MS = 35;
const DOUBLE_TAP_MS = 350;
const DPR_CAP = 2;

const STAR_REMOVE = {1:18, 2:26, 3:33, 4:39, 5:44, 6:48,
                     7:51, 8:54, 9:56, 10:58, 11:60};
const LEVEL_NAMES = {1:'Novice',2:'Easy',3:'Casual',4:'Mild',5:'Moderate',
                     6:'Medium',7:'Tricky',8:'Hard',9:'Expert',10:'Master',11:'Legend'};

const C = {
  gridBg:      '#141a2e',
  cellLight:   '#1e2640',
  cellDark:    '#1a2138',
  related:     '#2c3a64',
  same:        '#3a5880',
  selected:    '#4a80dc',
  conflict:    '#8c283c',
  conflictHi:  '#ff5a70',
  hoverBorder: '#8cbeff',
  hoverBorderA:'#8cffbe',
  lineThin:    '#2c3654',
  lineThick:   '#6990c8',
  gridOutline: '#6990c8',
  textGiven:   '#c8d2e6',
  textUser:    '#96f5aa',
  textCand:    '#6c7ea5',
  textCandH:   '#b9dcff',
  shadow:      'rgba(0,0,0,0.35)',
};

const STORAGE = {
  stats:    'sudoku_stats_v1',
  progress: 'sudoku_progress_v1',
  custom:   'sudoku_custom_v1',
};

const IS_TOUCH = matchMedia('(pointer: coarse)').matches;

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const sleep = ms => new Promise(r => setTimeout(r, ms));

const NUM_COL = [0,0,0];
for (let r = 0; r < 9; r++) { NUM_COL[r] = new Array(9); }
for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) NUM_COL[r][c] = null;

const CELL_X = new Int16Array(9);
const CELL_Y = new Int16Array(9);
for (let i = 0; i < 9; i++) { CELL_X[i] = GRID_X + i * CELL; CELL_Y[i] = GRID_Y + i * CELL; }

function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}
function emptyGrid() { return Array.from({length:9}, () => new Array(9).fill(0)); }
function cloneGrid(g) { return g.map(r => r.slice()); }
function filledCount(g) {
  let n = 0;
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) if (g[r][c]) n++;
  return n;
}
function peersOf(r, c) {
  const out = [];
  for (let i = 0; i < 9; i++) {
    if (i !== c) out.push([r, i]);
    if (i !== r) out.push([i, c]);
  }
  const br = (r/3|0)*3, bc = (c/3|0)*3;
  for (let rr = br; rr < br+3; rr++)
    for (let cc = bc; cc < bc+3; cc++)
      if (rr !== r || cc !== c) out.push([rr, cc]);
  return out;
}

function generateFull() {
  const g = emptyGrid();
  const rows = new Uint16Array(9), cols = new Uint16Array(9), boxes = new Uint16Array(9);
  function bt(pos) {
    if (pos === 81) return true;
    const r = (pos / 9) | 0, c = pos % 9;

function solveFirst(grid) {

          let cnt = 0;
          for (let v = 1; v <= 9; v++) if ((mask >> v) & 1) cnt++;
          if (cnt < bestCnt) {
            bestCnt = cnt; best = [r, c]; bestMask = mask;
            if (cnt === 0) return false;
            if (cnt === 1) break outer;
          }
        }
      }
    }
    if (!best) return true;
    const r = best[0], c = best[1];
    const b = (r/3|0)*3 + (c/3|0);
    let m = bestMask;
    while (m) {
      const bit = m & -m;
      m ^= bit;
      const v = 31 - Math.clz32(bit);
      g[r][c] = v;
      rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;

function generatePuzzle(stars) {
  const full = generateFull();
  const puzzle = cloneGrid(full);
  const target = STAR_REMOVE[stars];
  let removed = 0;
  const maxPasses = 1 + (stars / 4 | 0);
  for (let pass = 0; pass < maxPasses && removed < target; pass++) {
    const cells = [];
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++)
      if (puzzle[r][c] !== 0) cells.push([r, c]);
    for (let i = cells.length - 1; i > 0; i--) {
      const j = (Math.random() * (i+1)) | 0;
      const t = cells[i]; cells[i] = cells[j]; cells[j] = t;
    }
    for (const [r, c] of cells) {
      if (removed >= target) break;
      const backup = puzzle[r][c];
      puzzle[r][c] = 0;
      if (countSolutions(puzzle, 2) === 1) removed++;
      else puzzle[r][c] = backup;
    }
  }
  return [puzzle, full];
}

      seen.add(v);

  for (let c = 0; c < 9; c++) {
    const seen = new Set();
    for (let r = 0; r < 9; r++) {

      seen.add(v);

  for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {

    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {

  for (let c = 0; c < 9; c++) {
    const seen = new Set();
    for (let r = 0; r < 9; r++) {
      const v = g[r][c];

    }
  }
  for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
    const seen = new Set();
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {

  if (!validGrid(d.puzzle) || !validGrid(d.solution) || !validGrid(d.user)) return false;
  if (!Array.isArray(d.given) || d.given.length !== 9) return false;
  for (const row of d.given) {
    if (!Array.isArray(row) || row.length !== 9) return false;
    for (const b of row) if (typeof b !== 'boolean') return false;

  if (!isCompleteSolution(d.solution)) return false;
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    if (d.given[r][c]) {
      if (d.puzzle[r][c] === 0 || d.puzzle[r][c] !== d.solution[r][c] || d.user[r][c] !== 0) return false;
    } else {
      if (d.puzzle[r][c] !== 0) return false;

    for (let r = 0; r < 9; r++) {
      if (!Array.isArray(cands[r]) || cands[r].length !== 9) return false;
      for (let c = 0; c < 9; c++) {

        if (!Array.isArray(cell)) return false;
        if (d.user[r][c] !== 0 && cell.length) return false;

class Starfield {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: true });
    this.buckets = [[], [], [], []];
    for (let i = 0; i < 160; i++) {
      const size = Math.random() < 0.62 ? 1 : (Math.random() < 0.78 ? 2 : 3);
      this.buckets[size].push({
        x: Math.random(), y: Math.random(),
        base: 0.25 + Math.random() * 0.7,
        speed: 0.4 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
      });
    }
    this.resize();
  }
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.canvas.width = this.w * dpr;
    this.canvas.height = this.h * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  draw(t) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    const b1 = this.buckets[1];
    if (b1.length) {
      let lastC = -1;
      for (let i = 0; i < b1.length; i++) {
        const s = b1[i];
        const b = s.base * (0.55 + 0.45 * Math.sin(t * s.speed + s.phase));
        const c = (170 * b) | 0;
        if (c <= 0) continue;
        if (c !== lastC) {
          ctx.fillStyle = `rgb(${c},${Math.min(255, c + 15)},${Math.min(255, c + 55)})`;
          lastC = c;
        }
        ctx.fillRect(s.x * this.w, s.y * this.h, 1, 1);
      }
    }

    for (let size = 2; size <= 3; size++) {
      const arr = this.buckets[size];
      let lastC = -1;
      for (let i = 0; i < arr.length; i++) {
        const s = arr[i];
        const b = s.base * (0.55 + 0.45 * Math.sin(t * s.speed + s.phase));
        const c = (170 * b) | 0;
        if (c <= 0) continue;
        if (c !== lastC) {
          ctx.fillStyle = `rgb(${c},${Math.min(255, c + 15)},${Math.min(255, c + 55)})`;
          lastC = c;
        }
        ctx.fillRect((s.x * this.w - size/2) | 0, (s.y * this.h - size/2) | 0, size, size);
      }
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

class GridRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: true });
    this.state = null;
    this.hover = null;
    this.selected = null;
    this.conflictCells = new Set();
    this.autosolve = false;
    this.animations = new Map();
    this.resize();
  }
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    this.cssW = this.canvas.clientWidth || GRID_SIZE;
    this.cssH = this.canvas.clientHeight || GRID_SIZE;
    this.canvas.width = this.cssW * dpr;
    this.canvas.height = this.cssH * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.scale = this.cssW / GRID_SIZE;
  }
  cellFromEvent(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return null;
    const x = (clientX - rect.left) / rect.width * GRID_SIZE;
    const y = (clientY - rect.top) / rect.height * GRID_SIZE;
    if (x < 0 || y < 0 || x >= GRID_SIZE || y >= GRID_SIZE) return null;
    return [Math.floor(y / CELL), Math.floor(x / CELL)];
  }
  getAnim(cell) {
    const start = this.animations.get(cell);
    if (start === undefined) return null;
    const elapsed = performance.now() - start;
    if (elapsed > 260) { this.animations.delete(cell); return null; }
    const t = elapsed / 260;
    const c1 = 1.70158, c3 = c1 + 1;
    const s = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    return { scale: s, alpha: Math.min(1, t * 3) };
  }
  draw(t) {
    const ctx = this.ctx;
    const S = this.scale;
    ctx.save();
    ctx.clearRect(0, 0, this.cssW, this.cssH);
    ctx.scale(S, S);

    ctx.fillStyle = C.gridBg;
    roundRect(ctx, 0, 0, GRID_SIZE, GRID_SIZE, 18);
    ctx.fill();
    ctx.strokeStyle = C.gridOutline;
    ctx.lineWidth = 2;
    roundRect(ctx, 1, 1, GRID_SIZE - 2, GRID_SIZE - 2, 17);
    ctx.stroke();

    for (let r = 0; r < 9; r++) {
      const y = CELL_Y[r];
      for (let c = 0; c < 9; c++) {
        const box = (r/3|0)*3 + (c/3|0);
        ctx.fillStyle = box % 2 === 0 ? C.cellLight : C.cellDark;
        roundRect(ctx, CELL_X[c] + 2, y + 2, CELL - 4, CELL - 4, 7);
        ctx.fill();
      }
    }

    if (!this.state) { ctx.restore(); return; }

    const { puzzle, user, candidates } = this.state;
    const tSec = t / 1000;

    if (this.selected) {
      const [sr, sc] = this.selected;
      const selVal = puzzle[sr][sc] || user[sr][sc] || 0;
      const pulse = 0.5 + 0.5 * Math.sin(tSec * 3);

      for (let r = 0; r < 9; r++) {
        const y = CELL_Y[r];
        const rSame = (r === sr);
        for (let c = 0; c < 9; c++) {
          const x = CELL_X[c];
          const sameBox = ((r/3|0) === (sr/3|0)) && ((c/3|0) === (sc/3|0));
          let hl = null;
          if (rSame && c === sc) hl = C.selected;
          else if (rSame || c === sc || sameBox) hl = C.related;
          const val = puzzle[r][c] || user[r][c];
          if (selVal && val === selVal && !(rSame && c === sc)) hl = C.same;
          if (hl) {
            ctx.fillStyle = hl;
            roundRect(ctx, x + 2, y + 2, CELL - 4, CELL - 4, 7);
            ctx.fill();
          }
        }
      }

      const gx = CELL_X[sc] + CELL / 2;
      const gy = CELL_Y[sr] + CELL / 2;
      const gR = CELL * 1.6;
      const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, gR);
      const glowCol = this.autosolve ? 'rgba(120,230,180,' : 'rgba(110,180,255,';
      grd.addColorStop(0, glowCol + (0.22 + 0.16 * pulse) + ')');
      grd.addColorStop(0.6, glowCol + (0.06 + 0.04 * pulse) + ')');
      grd.addColorStop(1, glowCol + '0)');
      ctx.fillStyle = grd;
      ctx.fillRect(gx - gR, gy - gR, gR * 2, gR * 2);

      ctx.strokeStyle = this.autosolve ? '#8cffbe' : '#c8e6ff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = this.autosolve ? 'rgba(140,255,190,0.9)' : 'rgba(200,230,255,0.9)';
      ctx.shadowBlur = 12;
      roundRect(ctx, CELL_X[sc] + 3, CELL_Y[sr] + 3, CELL - 6, CELL - 6, 9);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    if (this.conflictCells.size) {
      ctx.fillStyle = C.conflict;
      ctx.strokeStyle = C.conflictHi;
      ctx.lineWidth = 2;
      for (const key of this.conflictCells) {
        const idx = key.indexOf(',');
        const r = +key.slice(0, idx), c = +key.slice(idx + 1);
        roundRect(ctx, CELL_X[c] + 2, CELL_Y[r] + 2, CELL - 4, CELL - 4, 7);
        ctx.fill();
        ctx.stroke();
      }
    }

    for (let i = 1; i < 9; i++) {
      const thick = i % 3 === 0;
      ctx.strokeStyle = thick ? C.lineThick : C.lineThin;
      ctx.lineWidth = thick ? 3 : 1;
      const p = GRID_X + i * CELL;
      ctx.beginPath();
      ctx.moveTo(p, GRID_Y);
      ctx.lineTo(p, GRID_Y + GRID_SIZE);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(GRID_X, p);
      ctx.lineTo(GRID_X + GRID_SIZE, p);
      ctx.stroke();
    }

    if (this.hover && (!this.selected || this.hover[0] !== this.selected[0] || this.hover[1] !== this.selected[1])) {
      const [hr, hc] = this.hover;
      const x = CELL_X[hc], y = CELL_Y[hr];
      const hgrad = ctx.createLinearGradient(x, y, x, y + CELL);
      hgrad.addColorStop(0, this.autosolve ? 'rgba(140,255,190,0.18)' : 'rgba(140,190,255,0.15)');
      hgrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hgrad;
      roundRect(ctx, x + 2, y + 2, CELL - 4, CELL - 4, 7);
      ctx.fill();

      ctx.strokeStyle = this.autosolve ? C.hoverBorderA : C.hoverBorder;
      ctx.lineWidth = 2;
      roundRect(ctx, x + 3, y + 3, CELL - 6, CELL - 6, 9);
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = '700 40px -apple-system, "Segoe UI", Arial, sans-serif';
    ctx.shadowColor = C.shadow;
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 1;
    for (let r = 0; r < 9; r++) {
      const y = CELL_Y[r] + CELL / 2;
      for (let c = 0; c < 9; c++) {
        const gv = puzzle[r][c];
        if (gv) {
          ctx.fillStyle = C.textGiven;
          ctx.fillText(String(gv), CELL_X[c] + CELL / 2, y);
        }
      }
    }
    ctx.shadowOffsetY = 0;

    for (let r = 0; r < 9; r++) {
      const y = CELL_Y[r] + CELL / 2;
      for (let c = 0; c < 9; c++) {
        const uv = user[r][c];
        if (!uv) continue;
        const anim = this.getAnim(r + ',' + c);
        ctx.save();
        ctx.fillStyle = C.textUser;
        if (anim) {
          ctx.globalAlpha = anim.alpha;
          ctx.translate(CELL_X[c] + CELL / 2, y);
          ctx.scale(anim.scale, anim.scale);
          ctx.shadowColor = 'rgba(150,245,170,0.6)';
          ctx.shadowBlur = 12;
          ctx.fillText(String(uv), 0, 0);
        } else {
          ctx.fillText(String(uv), CELL_X[c] + CELL / 2, y);
        }
        ctx.restore();
      }
    }

    ctx.font = '700 14px -apple-system, "Segoe UI", Arial, sans-serif';
    for (let r = 0; r < 9; r++) {
      const yBase = CELL_Y[r];
      const hoverRow = this.hover && this.hover[0] === r;
      for (let c = 0; c < 9; c++) {
        if (puzzle[r][c] || user[r][c]) continue;
        const cands = candidates[r][c];
        if (!cands || !cands.size) continue;
        const xBase = CELL_X[c];
        ctx.fillStyle = (hoverRow && this.hover[1] === c) ? C.textCandH : C.textCand;
        const sorted = Array.from(cands).sort((a, b) => a - b);
        for (let i = 0; i < sorted.length; i++) {
          const num = sorted[i];
          const idx = num - 1;
          const rr = (idx / 3) | 0;
          const cc = idx - rr * 3;
          const sx = xBase + cc * (CELL / 3) + CELL / 6;
          const sy = yBase + rr * (CELL / 3) + CELL / 6;
          ctx.fillText(String(num), sx, sy + 1);
        }
      }
    }

    ctx.restore();
  }
}

class Confetti {

    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  burst() {
    const N = 280;
    this.particles = new Array(N);
    const cx = this.logicalW / 2, cy = this.logicalH / 2;
    for (let i = 0; i < N; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.5 + Math.random() * 11;
      this.particles[i] = {
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        size: 3 + Math.random() * 4,
        color: this.colors[(Math.random() * this.colors.length) | 0],
        life: 1.0,
        decay: 0.004 + Math.random() * 0.006,
        gravity: 0.14 + Math.random() * 0.15,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.25,
      };
    }
    this.active = true;
    this.canvas.classList.add('active');
  }
  stop() {
    this.active = false;
    this.particles = [];
    this.canvas.classList.remove('active');
  }
  update() {
    if (!this.active) return;
    const parts = this.particles;
    let n = 0;
    const limitY = this.logicalH + 60;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.99;
      p.life -= p.decay;
      p.rot += p.rotV;
      if (p.life > 0 && p.y < limitY) parts[n++] = p;
    }
    parts.length = n;
    if (n === 0) this.stop();
  }
  draw() {
    if (!this.active) return;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.logicalW, this.logicalH);
    const parts = this.particles;
    let lastColor = null;
    let lastAlpha = -1;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const a = Math.max(0, Math.min(1, p.life * 1.7));
      const aStep = (a * 20) | 0;
      if (p.color !== lastColor || aStep !== lastAlpha) {
        const c = hexToRgb(p.color);
        ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${a.toFixed(2)})`;
        lastColor = p.color;
        lastAlpha = aStep;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    }
  }
}

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function bindGridEvents(canvas, getCell, onTap, opts) {
  opts = opts || {};
  const onContext = opts.onContext;
  const onHover = opts.onHover;

  canvas.addEventListener('mousedown', e => {
    const cell = getCell(e.clientX, e.clientY);
    if (!cell) return;
    if (e.button === 0) { e.preventDefault(); onTap(cell); }
    else if (e.button === 2 && onContext) { e.preventDefault(); onContext(cell); }
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  if (onHover) {
    canvas.addEventListener('mousemove', e => { onHover(getCell(e.clientX, e.clientY)); });
    canvas.addEventListener('mouseleave', () => onHover(null));
  }

  let pressCell = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { pressCell = null; return; }
    const t = e.touches[0];
    const cell = getCell(t.clientX, t.clientY);
    if (!cell) { pressCell = null; return; }
    pressCell = cell;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', () => { pressCell = null; }, { passive: true });
  canvas.addEventListener('touchend', () => {
    if (!pressCell) return;
    const cell = pressCell;
    pressCell = null;
    onTap(cell);
  }, { passive: true });
  canvas.addEventListener('touchcancel', () => { pressCell = null; }, { passive: true });
}

class DifficultyScreen extends Screen {
  constructor(app) {
    super(app, 'difficulty');
    this.starsRow = $('#diff-stars', this.el);
    this.label = $('#diff-label', this.el);
    this.best = $('#diff-best', this.el);
    this.hover = 0;
    this.lastTouch = 0;

    const frag = document.createDocumentFragment();
    for (let i = 1; i <= MAX_LEVEL; i++) {
      const slot = document.createElement('div');
      slot.className = 'star-slot';
      slot.dataset.level = i;
      slot.innerHTML = `<div class="star">★</div><div class="num">${i}</div>`;

      slot.addEventListener('mouseenter', () => {
        if (IS_TOUCH) return;
        this.hover = i;
        this.refresh();
      });
      slot.addEventListener('click', () => {
        if (IS_TOUCH) return;
        this.app.go('play', () => PlayScreen.newGenerated(this.app, i));
      });
      slot.addEventListener('touchstart', e => {
        e.preventDefault();
        const now = Date.now();
        if (this.hover === i && now - this.lastTouch < 1500) {
          this.app.go('play', () => PlayScreen.newGenerated(this.app, i));
        } else {
          this.hover = i;
          this.lastTouch = now;
          this.refresh();
        }
      }, { passive: false });

      frag.appendChild(slot);
    }
    this.starsRow.appendChild(frag);

    this.starsRow.addEventListener('mouseleave', () => {
      if (IS_TOUCH) return;
      this.hover = 0;
      this.refresh();
    });

    $('#diff-back', this.el).addEventListener('click', () => this.app.go('menu'));

    this.onKeyDown = (e) => {
      if (e.key === 'Escape') this.app.go('menu');
    };
  }
  activate() {
    this.hover = 0;
    this.refresh();
    window.addEventListener('keydown', this.onKeyDown);
  }
  deactivate() {
    window.removeEventListener('keydown', this.onKeyDown);
  }
  refresh() {
    const slots = this.starsRow.children;
    for (let i = 0; i < slots.length; i++) {
      const lvl = i + 1;
      slots[i].classList.toggle('on', lvl <= this.hover);
    }
    if (this.hover > 0) {
      const name = LEVEL_NAMES[this.hover].toUpperCase();
      this.label.textContent = name;
      this.label.style.color = this.hover >= 9 ? '#ffcd5a' :
                              this.hover >= 6 ? '#ffaa5a' : '#5fafff';
      const best = this.app.stats.best[this.hover];
      this.best.textContent = best ? `Best: ${formatTime(best.time)}` : 'Best: --';
    } else {
      this.label.textContent = IS_TOUCH ? 'Tap a level' : 'Hover over a level';
      this.label.style.color = '#8296c3';
      this.best.textContent = '';
    }
  }
}

class EditorScreen extends Screen {
  constructor(app) {
    super(app, 'editor');
    this.grid = emptyGrid();
    this.selected = null;
    this.hover = null;
    this.conflictCells = new Set();
    this.renderer = new GridRenderer($('#editor-canvas', this.el));
    this.statusEl = $('#editor-status', this.el);
    this._statusTimer = 0;

    this._emptyCandidates = Array.from({length:9}, () => Array.from({length:9}, () => new Set()));
    this._state = {
      puzzle: this.grid,
      user: emptyGrid(),
      given: Array.from({length:9}, () => new Array(9).fill(false)),
      candidates: this._emptyCandidates,
    };

    const pad = $('#editor-pad', this.el);
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= 9; i++) {
      const b = document.createElement('button');
      b.textContent = i;
      b.addEventListener('click', () => this.place(i));
      frag.appendChild(b);
    }
    pad.appendChild(frag);

    $('#editor-clear', this.el).addEventListener('click', () => this.clearSelected());
    $('#editor-save', this.el).addEventListener('click', () => this.saveToStorage());
    $('#editor-load', this.el).addEventListener('click', () => this.loadFromStorage());
    $('#editor-png', this.el).addEventListener('click', () => this.exportImage('png'));
    $('#editor-jpg', this.el).addEventListener('click', () => this.exportImage('jpeg'));
    $('#editor-play', this.el).addEventListener('click', () => this.tryPlay());
    $('#editor-back', this.el).addEventListener('click', () => this.app.go('menu'));

    const canvas = $('#editor-canvas', this.el);
    bindGridEvents(
      canvas,
      (x, y) => this.renderer.cellFromEvent(x, y),
      cell => {
        if (this.selected && this.selected[0] === cell[0] && this.selected[1] === cell[1]) {
          this.selected = null;
        } else {
          this.selected = cell;
        }
      },
      {
        onContext: cell => {
          this.grid[cell[0]][cell[1]] = 0;
          this.refreshStatus();
        },
        onHover: cell => { this.hover = cell; }
      }
    );

    this.onKeyDown = (e) => {
      if (e.key === 'Escape') this.app.go('menu');
    };
  }
  activate() {
    this.refreshStatus();
    this.renderer.resize();
    window.addEventListener('keydown', this.onKeyDown);
  }
  deactivate() {
    window.removeEventListener('keydown', this.onKeyDown);
    if (this._statusTimer) { clearTimeout(this._statusTimer); this._statusTimer = 0; }
  }
  update() {
    this._state.puzzle = this.grid;
    const given = this._state.given;
    for (let r = 0; r < 9; r++) {
      const gr = this.grid[r];
      const gv = given[r];
      for (let c = 0; c < 9; c++) gv[c] = gr[c] !== 0;
    }
    this.renderer.state = this._state;
    this.renderer.hover = this.hover;
    this.renderer.selected = this.selected;
    this.renderer.conflictCells = this.conflictCells;
  }
  draw(t) { this.renderer.draw(t / 1000); }
  place(num) {
    if (!this.selected) return;
    const [r, c] = this.selected;
    this.grid[r][c] = this.grid[r][c] === num ? 0 : num;
    this.refreshStatus();
  }
  clearSelected() {
    if (!this.selected) return;
    const [r, c] = this.selected;
    this.grid[r][c] = 0;
    this.refreshStatus();
  }
  computeConflicts() {
    const conflicts = new Set();
    const g = this.grid;
    for (let r = 0; r < 9; r++) {
      const seen = {};
      for (let c = 0; c < 9; c++) {
        const v = g[r][c];
        if (v) {
          if (v in seen) { conflicts.add(r+','+c); conflicts.add(r+','+seen[v]); }
          else seen[v] = c;
        }
      }
    }
    for (let c = 0; c < 9; c++) {
      const seen = {};
      for (let r = 0; r < 9; r++) {
        const v = g[r][c];
        if (v) {
          if (v in seen) { conflicts.add(r+','+c); conflicts.add(seen[v]+','+c); }
          else seen[v] = r;
        }
      }
    }
    for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
      const seen = {};
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        const rr = br*3+r, cc = bc*3+c;
        const v = g[rr][cc];
        if (v) {
          const key = rr+','+cc;
          if (v in seen) { conflicts.add(key); conflicts.add(seen[v]); }
          else seen[v] = key;
        }
      }
    }
    return conflicts;
  }
  refreshStatus() {
    this.conflictCells = this.computeConflicts();
    const setStatus = (txt, cls) => {
      this.statusEl.textContent = txt;
      this.statusEl.className = 'editor-status' + (cls ? ' ' + cls : '');
    };
    if (this.conflictCells.size) return setStatus('Conflicts detected', 'err');
    const filled = filledCount(this.grid);
    if (filled === 0) return setStatus('Empty grid', '');

    setStatus('Checking...', '');
    if (this._statusTimer) clearTimeout(this._statusTimer);
    this._statusTimer = setTimeout(() => {
      this._statusTimer = 0;
      const n = countSolutions(this.grid, 2);
      if (n === 0) return setStatus('No solution', 'err');
      if (n >= 2) return setStatus('Multiple solutions', 'warn');
      if (filled === 81) return setStatus('Complete - unique', 'ok');
      setStatus('Unique solution', 'ok');
    }, 0);
  }
  saveToStorage() {
    const ok = saveCustomGrid(this.grid);
    this.statusEl.textContent = ok ? 'Saved' : 'Save failed';
    this.statusEl.className = 'editor-status ' + (ok ? 'ok' : 'err');
  }
  loadFromStorage() {
    const g = loadCustomGrid();
    if (g) {
      this.grid = cloneGrid(g);
      this.refreshStatus();
    } else {
      this.statusEl.textContent = 'No save';
      this.statusEl.className = 'editor-status err';
    }
  }
  exportImage(ext) {
    const cell = 72;
    const pad = cell / 2;
    const size = pad * 2 + cell * 9;
    const c = document.createElement('canvas');
    const dpr = 2;
    c.width = size * dpr;
    c.height = size * dpr;
    const ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);
    const thin = Math.max(1, cell / 44);
    const thick = Math.max(3, cell / 20);
    const outer = Math.max(4, cell / 16);
    ctx.strokeStyle = '#000';
    for (let i = 1; i < 9; i++) {
      ctx.lineWidth = i % 3 === 0 ? thick : thin;
      const x = pad + i * cell;
      ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, pad + 9*cell); ctx.stroke();
      const y = pad + i * cell;
      ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad + 9*cell, y); ctx.stroke();
    }
    ctx.lineWidth = outer;
    ctx.strokeRect(pad, pad, 9*cell, 9*cell);
    ctx.fillStyle = '#000';
    ctx.font = `bold ${Math.round(cell * 0.78)}px Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let r = 0; r < 9; r++) for (let cc = 0; cc < 9; cc++) {
      const v = this.grid[r][cc];
      if (v) ctx.fillText(String(v), pad + cc*cell + cell/2, pad + r*cell + cell/2 + 2);
    }
    const link = document.createElement('a');
    const ts = new Date().toISOString().replace(/[-:T.]/g,'').slice(0, 15);
    link.download = `sudoku_${ts}.${ext}`;
    link.href = c.toDataURL('image/' + ext, ext === 'jpeg' ? 0.92 : undefined);
    link.click();
    this.statusEl.textContent = 'Saved ' + link.download;
    this.statusEl.className = 'editor-status ok';
  }
  tryPlay() {
    const setErr = (txt) => {
      this.statusEl.textContent = txt;
      this.statusEl.className = 'editor-status err';
    };
    if (filledCount(this.grid) === 0) return setErr('Grid is empty');
    if (this.conflictCells.size) return setErr('Conflicts detected');
    if (countSolutions(this.grid, 2) !== 1) return setErr('Solution not unique');
    if (filledCount(this.grid) === 81) return setErr('Already solved');
    const grid = cloneGrid(this.grid);
    this.app.go('play', () => PlayScreen.newCustom(this.app, grid));
  }
}

class PlayScreen extends Screen {
  constructor(app, opts = {}) {
    super(app, 'play');
    this.puzzle = emptyGrid();
    this.solution = emptyGrid();
    this.user = emptyGrid();
    this.candidates = Array.from({length:9}, () => Array.from({length:9}, () => new Set()));
    this.given = Array.from({length:9}, () => new Array(9).fill(false));
    this.stars = 0;
    this.errors = 0;
    this.hintsLeft = MAX_HINTS;
    this.elapsedOffset = 0;
    this.finished = false;
    this.cheated = false;
    this.selected = null;
    this.hover = null;
    this.popupCell = null;
    this.autosolve = false;
    this.undoStack = [];
    this.redoStack = [];
    this.startMs = performance.now();
    this.savePending = false;
    this.saveMs = 0;
    this.solving = false;
    this.solveQueue = [];
    this.solveNextMs = 0;
    this._panelDirty = true;
    this._cachedCounts = null;
    this.lastTapCell = null;
    this.lastTapTime = 0;

    if (opts.progress) this.restore(opts.progress);

    this.renderer = new GridRenderer($('#play-canvas', this.el));
    this.popupEl = $('#popup', this.el);
    this.starsEl = $('#play-stars', this.el);
    this.timeEl = $('#play-time', this.el);
    this.hintsEl = $('#play-hints', this.el);
    this.undoBtn = $('#play-undo', this.el);
    this.redoBtn = $('#play-redo', this.el);
    this.hintBtn = $('#play-hint', this.el);
    this.clearBtn = $('#play-clear', this.el);

    this.padButtons = [];
    const pad = $('#play-pad', this.el);
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= 9; i++) {
      const b = document.createElement('button');
      b.textContent = i;
      b.addEventListener('click', () => this.placeNumber(i));
      frag.appendChild(b);
      this.padButtons.push(b);
    }
    pad.appendChild(frag);

    this.undoBtn.addEventListener('click', () => this.undo());
    this.redoBtn.addEventListener('click', () => this.redo());
    this.hintBtn.addEventListener('click', () => this.hint());
    this.clearBtn.addEventListener('click', () => this.clearSelected());

    this.popupEl.innerHTML = '';
    const popFrag = document.createDocumentFragment();
    for (let i = 1; i <= 9; i++) {
      const b = document.createElement('button');
      b.textContent = i;
      b.dataset.num = i;
      b.addEventListener('click', e => {
        e.stopPropagation();
        this.toggleCandidate(i);
        this.refreshPopupSelection();
      });
      popFrag.appendChild(b);
    }
    this.popupEl.appendChild(popFrag);

    this.onDocMouseDown = (e) => {
      if (!this.popupEl.classList.contains('active')) return;
      if (!this.popupEl.contains(e.target) && !e.target.closest('#play-canvas')) this.closePopup();
    };
    this.onDocTouchStart = (e) => {
      if (!this.popupEl.classList.contains('active')) return;
      const t = e.target;
      if (!this.popupEl.contains(t) && !t.closest('#play-canvas')) this.closePopup();
    };

    const canvas = $('#play-canvas', this.el);
    bindGridEvents(
      canvas,
      (x, y) => this.renderer.cellFromEvent(x, y),
      cell => this.onLeftClick(cell),
      { onHover: cell => { this.hover = cell; } }
    );

    this.onKeyDown = this.onKeyDown.bind(this);
  }

  static newGenerated(app, stars) {
    const s = new PlayScreen(app);
    s.stars = stars;
    let key, puzzle, solution;
    for (let attempt = 0; attempt < 60; attempt++) {
      [puzzle, solution] = generatePuzzle(stars);
      key = puzzle.map(r => r.join('')).join('');
      if (!app.puzzlesSeen.has(key)) break;
    }
    app.puzzlesSeen.add(key);
    if (app.puzzlesSeen.size > 3000) app.puzzlesSeen = new Set([key]);
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      s.puzzle[r][c] = puzzle[r][c];
      s.solution[r][c] = solution[r][c];
      s.given[r][c] = puzzle[r][c] !== 0;
    }
    s.autosaveNow();
    return s;
  }

  static newCustom(app, grid) {
    const s = new PlayScreen(app);
    s.stars = 0;
    s.solution = solveFirst(grid);
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      s.puzzle[r][c] = grid[r][c];
      s.given[r][c] = grid[r][c] !== 0;
    }
    s.autosaveNow();
    return s;
  }

  restore(d) {
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      this.puzzle[r][c] = d.puzzle[r][c];
      this.solution[r][c] = d.solution[r][c];
      this.user[r][c] = d.user[r][c];
      this.given[r][c] = d.given[r][c];
    }
    if (d.candidates) {
      for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
        this.candidates[r][c] = new Set(d.candidates[r][c]);
      }
    }
    this.stars = d.stars || 0;
    this.errors = d.errors || 0;
    this.hintsLeft = d.hints_left ?? MAX_HINTS;
    this.elapsedOffset = d.elapsed || 0;
    this.startMs = performance.now();
  }

  elapsed() {
    if (this.finished) return this.elapsedOffset;
    return this.elapsedOffset + (performance.now() - this.startMs) / 1000;
  }
  serialize() {
    return {
      puzzle: this.puzzle,
      solution: this.solution,
      user: this.user,
      given: this.given,
      candidates: this.candidates.map(row => row.map(s => Array.from(s))),
      stars: this.stars,
      errors: this.errors,
      hints_left: this.hintsLeft,
      elapsed: this.elapsed(),
    };
  }
  markDirty() {
    this.savePending = true;
    this.saveMs = performance.now();
    this._panelDirty = true;
  }
  autosaveNow() {
    if (this.finished) return;
    saveProgress(this.serialize());
    this.savePending = false;
  }
  onExit() {
    if (!this.finished && this.savePending) this.autosaveNow();
  }
  activate() {
    this.renderer.resize();
    window.addEventListener('keydown', this.onKeyDown);
    document.addEventListener('mousedown', this.onDocMouseDown);
    document.addEventListener('touchstart', this.onDocTouchStart, { passive: true });
    this.refreshStars();
    this.refreshPanel();
  }
  deactivate() {
    window.removeEventListener('keydown', this.onKeyDown);
    document.removeEventListener('mousedown', this.onDocMouseDown);
    document.removeEventListener('touchstart', this.onDocTouchStart);
    this.onExit();
    this.closePopup();
  }
  refreshStars() {
    this.starsEl.innerHTML = '';
    if (this.stars > 0) {
      const frag = document.createDocumentFragment();
      for (let i = 1; i <= MAX_LEVEL; i++) {
        const s = document.createElement('span');
        s.className = 'star' + (i <= this.stars ? ' on' : '');
        s.textContent = '★';
        frag.appendChild(s);
      }
      this.starsEl.appendChild(frag);
    } else {
      const b = document.createElement('div');
      b.className = 'custom-badge';
      b.textContent = 'CUSTOM PUZZLE';
      this.starsEl.appendChild(b);
    }
  }
  refreshTime() {
    this.timeEl.textContent = 'TIME  ' + formatTime(this.elapsed());
  }
  _recountNumbers() {
    const counts = new Array(10).fill(0);
    for (let r = 0; r < 9; r++) {
      const pr = this.puzzle[r], ur = this.user[r];
      for (let c = 0; c < 9; c++) {
        const p = pr[c];
        if (p) counts[p]++;
        const u = ur[c];
        if (u) counts[u]++;
      }
    }
    this._cachedCounts = counts;
  }
  refreshPanel() {
    if (!this._cachedCounts) this._recountNumbers();
    const counts = this._cachedCounts;
    this.hintsEl.textContent = 'HINTS  ' + this.hintsLeft;
    this.undoBtn.disabled = this.undoStack.length === 0;
    this.redoBtn.disabled = this.redoStack.length === 0;
    const canHint = this.hintsLeft > 0 && !this.finished;
    this.hintBtn.disabled = !canHint;
    this.hintBtn.textContent = 'HINT ' + this.hintsLeft;
    for (let i = 0; i < 9; i++) {
      this.padButtons[i].classList.toggle('dimmed', counts[i + 1] >= 9);
    }
  }
  update() {
    if (this.savePending && !this.finished) {
      if (performance.now() - this.saveMs >= SAVE_DEBOUNCE_MS) this.autosaveNow();
    }
    if (this.solving) {
      const now = performance.now();
      if (now >= this.solveNextMs && this.solveQueue.length) {
        const [r, c] = this.solveQueue.shift();
        this.user[r][c] = this.solution[r][c];
        this.candidates[r][c].clear();
        this.renderer.animations.set(r + ',' + c, now);
        this.solveNextMs = now + SOLVE_STEP_MS;
        this._panelDirty = true;
        this._cachedCounts = null;
      }
      if (!this.solveQueue.length) {
        this.solving = false;
        this.checkAndFinish();
      }
    }
    this.refreshTime();
    if (this._panelDirty) {
      this.refreshPanel();
      this._panelDirty = false;
    }
  }
  draw(t) {
    this.renderer.state = {
      puzzle: this.puzzle, user: this.user,
      given: this.given, candidates: this.candidates,
    };
    this.renderer.hover = this.solving ? null : this.hover;
    this.renderer.selected = this.solving ? null : this.selected;
    this.renderer.autosolve = this.autosolve;
    this.renderer.draw(t);
  }

  onLeftClick(cell) {
    if (this.finished || this.solving) return;
    if (this.popupCell) this.closePopup();

    const now = performance.now();
    const last = this.lastTapCell;
    const isDouble = last && last[0] === cell[0] && last[1] === cell[1] &&
                     now - this.lastTapTime < DOUBLE_TAP_MS;

    if (isDouble) {
      this.lastTapCell = null;
      this.lastTapTime = 0;
      this.selected = cell;
      if (this.autosolve) { this.autosolveClick(cell); return; }
      const [r, c] = cell;
      if (!this.given[r][c] && this.user[r][c] === 0) this.openPopup(cell);
      return;
    }

    this.lastTapCell = cell;
    this.lastTapTime = now;

    if (this.autosolve) {
      this.selected = cell;
      this.autosolveClick(cell);
      return;
    }

    if (this.selected && this.selected[0] === cell[0] && this.selected[1] === cell[1]) {
      this.selected = null;
    } else {
      this.selected = cell;
    }
  }

  openPopup(cell) {
    this.popupCell = cell;
    const [r, c] = cell;
    let px = c * CELL + CELL / 2 - POPUP_SIZE_LOCAL / 2;
    let py = r * CELL + CELL / 2 - POPUP_SIZE_LOCAL / 2;
    px = Math.max(4, Math.min(px, GRID_SIZE - POPUP_SIZE_LOCAL - 4));
    py = Math.max(4, Math.min(py, GRID_SIZE - POPUP_SIZE_LOCAL - 4));
    const st = this.popupEl.style;
    st.left = px + 'px';
    st.top = py + 'px';
    st.width = POPUP_SIZE_LOCAL + 'px';
    st.height = POPUP_SIZE_LOCAL + 'px';
    this.popupEl.classList.add('active');
    this.refreshPopupSelection();
  }
  closePopup() {
    this.popupCell = null;
    this.popupEl.classList.remove('active');
  }
  refreshPopupSelection() {
    if (!this.popupCell) return;
    const [r, c] = this.popupCell;
    const cands = this.candidates[r][c];
    const btns = this.popupEl.children;
    for (let i = 0; i < 9; i++) {
      btns[i].classList.toggle('sel', cands.has(i + 1));
    }
  }
  toggleCandidate(num) {
    if (!this.popupCell) return;
    const [r, c] = this.popupCell;
    if (this.given[r][c] || this.user[r][c] !== 0) return;
    this.record(r, c);
    const cands = this.candidates[r][c];
    if (cands.has(num)) cands.delete(num); else cands.add(num);
    this.markDirty();
  }
  record(r, c) {
    const peers = peersOf(r, c).map(([pr, pc]) => [[pr, pc], new Set(this.candidates[pr][pc])]);
    this.undoStack.push([r, c, this.user[r][c], new Set(this.candidates[r][c]), peers]);
    if (this.undoStack.length > 300) this.undoStack.shift();
    this.redoStack = [];
    this._panelDirty = true;
  }
  applyRestore(rec) {
    const [r, c, val, cands, peers] = rec;
    this.user[r][c] = val;
    this.candidates[r][c] = new Set(cands);
    for (let i = 0; i < peers.length; i++) {
      const [pos, pcands] = peers[i];
      this.candidates[pos[0]][pos[1]] = new Set(pcands);
    }
    this.renderer.animations.set(r + ',' + c, performance.now());
  }
  undo() {
    if (!this.undoStack.length) return;
    const rec = this.undoStack.pop();
    const [r, c] = rec;
    const curPeers = peersOf(r, c).map(([pr, pc]) => [[pr, pc], new Set(this.candidates[pr][pc])]);
    this.redoStack.push([r, c, this.user[r][c], new Set(this.candidates[r][c]), curPeers]);
    this.applyRestore(rec);
    this.markDirty();
    this._cachedCounts = null;
  }
  redo() {
    if (!this.redoStack.length) return;
    const rec = this.redoStack.pop();
    const [r, c] = rec;
    const curPeers = peersOf(r, c).map(([pr, pc]) => [[pr, pc], new Set(this.candidates[pr][pc])]);
    this.undoStack.push([r, c, this.user[r][c], new Set(this.candidates[r][c]), curPeers]);
    this.applyRestore(rec);
    this.markDirty();
    this._cachedCounts = null;
  }
  removeCandidateFromPeers(r, c, num) {
    for (const [pr, pc] of peersOf(r, c)) this.candidates[pr][pc].delete(num);
  }
  placeNumber(num) {
    if (this.finished || this.solving || !this.selected) return;
    const [r, c] = this.selected;
    if (this.given[r][c]) return;
    if (this.user[r][c] === num && this.candidates[r][c].size === 0) {
      this.record(r, c);
      this.user[r][c] = 0;
      this.markDirty();
      this._cachedCounts = null;
      return;
    }
    this.record(r, c);
    if (this.user[r][c] === num) {
      this.user[r][c] = 0;
    } else {
      this.user[r][c] = num;
      this.candidates[r][c].clear();
      this.removeCandidateFromPeers(r, c, num);
      if (this.solution[r][c] !== num) this.errors++;
      this.renderer.animations.set(r + ',' + c, performance.now());
    }
    this._cachedCounts = null;
    this.checkAndFinish();
    if (!this.finished) this.markDirty();
  }
  autosolveClick(cell) {
    if (this.finished) return;
    const [r, c] = cell;
    if (this.given[r][c]) return;
    this.record(r, c);
    if (this.user[r][c] === this.solution[r][c]) {
      this.user[r][c] = 0;
    } else {
      this.user[r][c] = this.solution[r][c];
      this.candidates[r][c].clear();
      this.removeCandidateFromPeers(r, c, this.solution[r][c]);
      this.renderer.animations.set(r + ',' + c, performance.now());
    }
    this._cachedCounts = null;
    this.checkAndFinish();
    if (!this.finished) this.markDirty();
  }
  clearSelected() {
    if (this.finished || this.solving || !this.selected) return;
    const [r, c] = this.selected;
    if (this.given[r][c]) return;
    if (this.user[r][c] === 0 && this.candidates[r][c].size === 0) return;
    this.record(r, c);
    this.user[r][c] = 0;
    this.candidates[r][c].clear();
    this._cachedCounts = null;
    this.markDirty();
  }
  hint() {
    if (this.finished || this.solving || this.hintsLeft <= 0 || !this.selected) return;
    const [r, c] = this.selected;
    if (this.given[r][c]) return;
    if (this.user[r][c] === this.solution[r][c]) return;
    this.record(r, c);
    this.hintsLeft--;
    this.user[r][c] = this.solution[r][c];
    this.candidates[r][c].clear();
    this.removeCandidateFromPeers(r, c, this.solution[r][c]);
    this.renderer.animations.set(r + ',' + c, performance.now());
    this._cachedCounts = null;
    this.checkAndFinish();
    if (!this.finished) this.markDirty();
  }
  startSolve() {
    if (this.finished || this.solving) return;
    this.solving = true;
    this.cheated = true;
    this.autosolve = false;
    this.selected = null;
    this.closePopup();
    this.undoStack.length = 0;
    this.redoStack.length = 0;
    this.solveQueue.length = 0;
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      if (!this.given[r][c] && this.user[r][c] !== this.solution[r][c]) {
        this.solveQueue.push([r, c]);
      }
    }
    this.solveNextMs = performance.now();
    this.savePending = false;
    this._panelDirty = true;
  }
  restart() {
    this.user = emptyGrid();
    this.candidates = Array.from({length:9}, () => Array.from({length:9}, () => new Set()));
    this.selected = null;
    this.hover = null;
    this.closePopup();
    this.undoStack.length = 0;
    this.redoStack.length = 0;
    this.errors = 0;
    this.hintsLeft = MAX_HINTS;
    this.autosolve = false;
    this.solving = false;
    this.solveQueue.length = 0;
    this.cheated = false;
    this.startMs = performance.now();
    this.elapsedOffset = 0;
    this.lastTapCell = null;
    this.lastTapTime = 0;
    this._cachedCounts = null;
    this.markDirty();
  }
  isSolved() {
    const sol = this.solution;
    for (let r = 0; r < 9; r++) {
      const pr = this.puzzle[r], ur = this.user[r], sr = sol[r];
      for (let c = 0; c < 9; c++) {
        const v = pr[c] || ur[c];
        if (v !== sr[c]) return false;
      }
    }
    return true;
  }
  checkAndFinish() {
    if (this.finished) return;
    if (!this.isSolved()) return;
    this.finished = true;
    this.elapsedOffset = this.elapsed();
    clearProgress();
    this.savePending = false;
    if (this.stars > 0 && !this.cheated) {
      const lvl = String(this.stars);
      const prev = this.app.stats.best[lvl];
      if (!prev || this.elapsedOffset < prev.time) {
        this.app.stats.best[lvl] = { time: this.elapsedOffset };
        saveStats(this.app.stats);
      }
    }
    const snapshot = {
      puzzle: cloneGrid(this.puzzle),
      user: cloneGrid(this.user),
      given: this.given.map(r => r.slice()),
    };
    const elapsed = this.elapsedOffset;
    const hintsUsed = MAX_HINTS - this.hintsLeft;
    this.app.go('won', () => new WonScreen(this.app, elapsed, hintsUsed, snapshot));
  }
  onKeyDown(e) {
    if (this.solving) return;
    const ctrl = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') { this.app.go('menu'); return; }
    if (ctrl && e.code === 'KeyZ') { e.preventDefault(); this.undo(); return; }
    if (ctrl && e.code === 'KeyY') { e.preventDefault(); this.redo(); return; }
    if (ctrl && e.code === 'KeyS') {
      e.preventDefault();
      if (!e.shiftKey) this.startSolve();
      return;
    }
    if (ctrl) return;
    if (e.key === 'a' || e.key === 'ф') { this.autosolve = !this.autosolve; return; }
    if (e.key === 'h' || e.key === 'р') { this.hint(); return; }
    if (e.key === 'r' || e.key === 'к') { this.restart(); return; }
    if (e.key === 'n' || e.key === 'т') {
      if (this.stars > 0) {
        const s = this.stars;
        this.finished = true;
        clearProgress();
        this.savePending = false;
        this.app.go('play', () => PlayScreen.newGenerated(this.app, s));
      } else {
        this.app.go('menu');
      }
      return;
    }
    if (e.key === 'Backspace' || e.key === 'Delete') { this.clearSelected(); return; }
    if (e.key >= '1' && e.key <= '9') { this.placeNumber(Number(e.key)); return; }
  }
}

class WonScreen extends Screen {
  constructor(app, elapsed, hintsUsed, snapshot) {
    super(app, 'won');
    this.elapsed = elapsed;
    this.hintsUsed = hintsUsed;
    this.snapshot = snapshot;
    this.renderer = new GridRenderer($('#won-canvas', this.el));
    this.statsEl = $('#won-stats', this.el);
    this.timers = [];
    this.listenersAttached = false;
    this._emptyCands = Array.from({length:9}, () => Array.from({length:9}, () => new Set()));
    this._state = {
      puzzle: snapshot.puzzle,
      user: snapshot.user,
      given: snapshot.given,
      candidates: this._emptyCands,
    };

    this.onClick = () => this.app.go('menu');
    this.onKey = (e) => {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        this.app.go('menu');
      }
    };
  }
  activate() {
    this.renderer.resize();
    this.statsEl.innerHTML =
      `TIME&nbsp;&nbsp;${formatTime(this.elapsed)}<br>HINTS USED&nbsp;&nbsp;${this.hintsUsed}`;
    this.listenersAttached = false;

    const t1 = setTimeout(() => {
      if (this.app.currentScreen === this) this.app.confetti.burst();
    }, 120);

    const t2 = setTimeout(() => {
      if (this.app.currentScreen !== this) return;
      this.el.addEventListener('mousedown', this.onClick);
      this.el.addEventListener('touchstart', this.onClick, { passive: true });
      window.addEventListener('keydown', this.onKey);
      this.listenersAttached = true;
    }, 500);

    this.timers = [t1, t2];
  }
  deactivate() {
    for (let i = 0; i < this.timers.length; i++) clearTimeout(this.timers[i]);
    this.timers = [];
    if (this.listenersAttached) {
      this.el.removeEventListener('mousedown', this.onClick);
      this.el.removeEventListener('touchstart', this.onClick);
      window.removeEventListener('keydown', this.onKey);
      this.listenersAttached = false;
    }
    this.app.confetti.stop();
  }
  draw(t) {
    this.renderer.state = this._state;
    this.renderer.hover = null;
    this.renderer.selected = null;
    this.renderer.draw(t);
  }
}

class App {
  constructor() {
    this.stage = $('#stage');
    this.fadeEl = $('#fade');
    this.starsCanvas = $('#stars');
    this.confettiCanvas = $('#confetti');
    this.starfield = new Starfield(this.starsCanvas);
    this.confetti = new Confetti(this.confettiCanvas);
    this.stats = loadStats();
    this.puzzlesSeen = new Set();
    this.currentScreen = null;
    this.transitioning = false;
    this.stageScale = 1;
    this.clockMs = 0;
    this.lastTick = performance.now();

    this._resizeBound = () => this.resize();
    this._orientBound = () => setTimeout(() => this.resize(), 120);

    window.addEventListener('resize', this._resizeBound);
    window.addEventListener('orientationchange', this._orientBound);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', this._resizeBound);
    }

    this.resize();

    this.requestTick = this.requestTick.bind(this);
    requestAnimationFrame(this.requestTick);

    this.installScreen('menu', new MenuScreen(this));
    this.currentScreen.activate();
  }

  resize() {
    const portrait = window.innerHeight > window.innerWidth;
    document.body.classList.toggle('portrait', portrait);
    document.body.classList.toggle('landscape', !portrait);
    const sw = portrait ? PORTRAIT_W : LANDSCAPE_W;
    const sh = portrait ? PORTRAIT_H : LANDSCAPE_H;
    const st = this.stage.style;
    st.width = sw + 'px';
    st.height = sh + 'px';
    const s = Math.min(window.innerWidth / sw, window.innerHeight / sh);
    this.stageScale = s;
    st.transform = `scale(${s})`;
    this.starfield.resize();
    this.confetti.resize();
    if (this.currentScreen && this.currentScreen.renderer) {
      const r = this.currentScreen.renderer;
      requestAnimationFrame(() => r.resize());
    }
  }

  installScreen(name, screen) {
    const actives = $$('.screen.active');
    for (let i = 0; i < actives.length; i++) actives[i].classList.remove('active');
    const el = document.querySelector(`[data-screen="${name}"]`);
    if (el) el.classList.add('active');
    this.currentScreen = screen;
  }

  async go(name, factory) {
    if (this.transitioning) return;
    this.transitioning = true;
    if (this.currentScreen) this.currentScreen.deactivate();
    this.fadeEl.style.opacity = '1';
    await sleep(160);
    const screen = factory ? factory() : this._makeScreen(name);
    this.installScreen(name, screen);
    screen.activate();
    this.fadeEl.style.opacity = '0';
    await sleep(160);
    this.transitioning = false;
  }

  _makeScreen(name) {
    if (name === 'menu') return new MenuScreen(this);
    if (name === 'difficulty') return new DifficultyScreen(this);
    if (name === 'editor') return new EditorScreen(this);
    if (name === 'play') return new PlayScreen(this);
    throw new Error('Unknown screen: ' + name);
  }

  requestTick(now) {
    const dt = now - this.lastTick;
    this.lastTick = now;
    this.clockMs += dt;
    this.starfield.draw(this.clockMs / 1000);
    if (this.currentScreen) {
      this.currentScreen.update(dt);
      this.currentScreen.draw(this.clockMs);
    }
    if (this.confetti.active) {
      this.confetti.update();
      this.confetti.draw();
    }
    requestAnimationFrame(this.requestTick);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  window.__app = new App();
});
</script>
